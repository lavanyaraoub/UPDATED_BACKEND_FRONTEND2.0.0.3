---
# ****************************************************************************************************
# EDITTING OF THIS FILE SHOULD BE DONE BY EXPERIENCED PERSONNEL ONLY
# ANY CHANGE WITHOUT PROPER KNOWLEDGE OF ETHERCAT DEVICE ADDRESSING CAN CAUSE DAMAGE TO THE SYSTEM
# ****************************************************************************************************
# EtherCAT addressing configuration for Inovance SV680N-GINT (SV680NT012I) + DDR motor (1:1).
# VendorID: 0x00100000  ProductCode: 0x000C012A  Revision: 0x00010000
# ESI: INOVANCE_SV680N-GINT_1Axis_V02.xml
#
# Key points (from ESI + bench reads + SV680N Communication Guide A00):
#  - Supports PP, PV, PT, HM, CSP, CSV, CST (0x6502 = 0x3AD)
#  - Default RxPDO 0x1701 has NO 0x6060 -> we remap configurable 0x1600 / 0x1A00
#  - 0x608F, 0x6092, 0x60C2 do NOT exist on this drive (no interpolation-period writes)
#  - USER UNITS = 0.0001 DEGREE (since 22-Oct-2026, replaces arc-seconds):
#      0x6091 gear ratio = 65536 / 28125  ->  1 user unit = 0.0001 deg (0.36 arcsec)
#      1 rev = 3,600,000 units = 8,388,608 encoder counts (23-bit) EXACTLY
#      1 unit = 2.3302 counts.  1 degree = 10000 units.  0.001 deg = 10 units.
#    Every position/velocity/accel object (0x607A, 0x6064, 0x60FF, 0x606C,
#    0x6081, 0x607F, 0x6083, 0x6084, 0x6067) is in these user units.
#    Int32 position range = +/-596 revolutions (see Bug 1: wrap handling).
#    !! After changing the gear ratio the stored home (HomingApos) is invalid -> RE-HOME !!
#  - Standby / hold mode is Profile Position (Mode 1, see InovanceSV680N.StandbyOpMode).
#  - Digital inputs 0x60FD: bit0 NOT, bit1 POT, bit2 HOME, bit16..20 = DI1..DI5.
#    Bits 3..15 are NOT USED on SV680N - never decode them.
#    VERIFY polarity on the bench before enabling StopWhenHWPOTNOT.
#  - Drive also supports EoE: the eoe* interface must stay DOWN or SDOs fail randomly.
#  - 0x603F error code -> panel code "E" + 3 hex digits (0x0E08 = EE08 sync loss,
#    0x0939 = E939 motor power cable disconnected).

ethercat:
    - operation:
      name: configure
      steps:
        # 0x6091 electronic gear ratio, written every startup so a value left in
        # the drive by an earlier test can never change the scaling.
        # encoder counts per user unit = 6091:01 / 6091:02 = 65536 / 28125
        #   = 8,388,608 counts / 3,600,000 units  (exact, no drift per revolution)
        - step:
          name: "gear ratio motor revolutions"
          address: 0x6091
          subindex: 0x01
          value: "65536"
          delay: 0
          isBinary: false
          dataType: "U32"
        - step:
          name: "gear ratio shaft revolutions"
          address: 0x6091
          subindex: 0x02
          value: "28125"
          delay: 0
          isBinary: false
          dataType: "U32"
        - step:
          name: "operation mode (PP)"
          address: 0x6060
          subindex: 0x00
          value: "0x1"
          delay: 0
          isBinary: false
          dataType: "U8"
        # PP move speed (G01 F is not applied dynamically yet).
        # 4,291,534 units/s = ~71.5 rpm (same physical speed as before).
        - step:
          name: "profile velocity"
          address: 0x6081
          subindex: 0x00
          value: "4291534"
          delay: 0
          isBinary: false
          dataType: "U32"
        # Hard speed cap in the drive: 300 rpm motor max (DDR).
        # 300 x 3,600,000 / 60 = 18,000,000 units/s. Any jog/feed above this is clamped.
        - step:
          name: "max profile velocity (300 rpm)"
          address: 0x607F
          subindex: 0x00
          value: "18000000"
          delay: 0
          isBinary: false
          dataType: "U32"
        # 0x6083 / 0x6084 written explicitly every startup (H0E.01 = 4 saves
        # SDO writes made before OP to EEPROM, so old values would otherwise stay).
        # Unit: units/s^2 (0.0001 deg/s^2). Ramp time = speed / accel.
        #   42,915,344 units/s^2 = ~715 rpm/s (same ramp as before)
        #   -> ~100 ms to reach the 71.5 rpm profile velocity, ~420 ms from 300 rpm to 0.
        # Smoother: lower the value. Snappier: raise it.
        - step:
          name: "profile acceleration"
          address: 0x6083
          subindex: 0x00
          value: "42915344"
          delay: 0
          isBinary: false
          dataType: "U32"
        - step:
          name: "profile deceleration"
          address: 0x6084
          subindex: 0x00
          value: "42915344"
          delay: 0
          isBinary: false
          dataType: "U32"
        # Position window: "target reached" (SW bit10) only when |error| <= 8 units
        # (0.0008 deg = 2.9 arcsec, ~19 encoder counts) for 0x6068 ms - same
        # physical size as the previous 3 arcsec. Tighten after gain tuning.
        # Must stay <= ppHoldInWindowCounts (14) in drive_rotation.go.
        - step:
          name: "position window (0.0001 deg)"
          address: 0x6067
          subindex: 0x00
          value: "8"
          delay: 0
          isBinary: false
          dataType: "U32"
        - step:
          name: "position window time (ms)"
          address: 0x6068
          subindex: 0x00
          value: "10"
          delay: 0
          isBinary: false
          dataType: "U16"
    - operation:
      name: poweron
      steps:
        - step:
          name: "drive init"
          address: 0x6040
          subindex: 0x00
          value: "0x0006"
          delay: 100000
          isBinary: false
          dataType: "U16"
        - step:
          name: "drive magnetize"
          address: 0x6040
          subindex: 0x00
          value: "7"
          delay: 100000
          isBinary: false
          dataType: "U16"
    - operation:
      name: fastPowerOn
      steps:
        - step:
          name: "fast poweron"
          address: 0x6040
          subindex: 0x00
          value: "0000000000001111"
          delay: 0
          isBinary: true
          dataType: "U16"
          action: "write"
    - operation:
      name: fastPowerOff
      steps:
        - step:
          name: "fast poweroff read"
          address: 0x6040
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
        - step:
          name: "fast poweroff"
          address: 0x6040
          subindex: 0x00
          value: "00000110"
          delay: 0
          isBinary: true
          dataType: "U16"
          action: "write"
    - operation:
      name: poweroff
      steps:
        - step:
          name: "start power off"
          address: 0x6040
          subindex: 0x00
          value: "11111111"
          delay: 0
          isBinary: true
          dataType: "U16"
        - step:
          name: "power off"
          address: 0x6040
          subindex: 0x00
          value: "00000110"
          delay: 0
          isBinary: true
          dataType: "U16"
    - operation:
      name: manualjog
      steps:
        - step:
          name: "target velocity"
          address: 0x60FF
          subindex: 0x00
          #value will be populated by the system. Do not change the jog_rpm_placeholder string.
          value: "jog_rpm_placeholder"
          isBinary: false
          dataType: "U32"
          delay: 0
        - step:
          name: "operation mode (PV)"
          address: 0x6060
          subindex: 0x00
          value: "0x3"
          delay: 0
          isBinary: false
          dataType: "U8"
    - operation:
      name: stopjog
      steps:
        - step:
          name: "target velocity"
          address: 0x60FF
          subindex: 0x00
          value: "0"
          isBinary: false
          dataType: "U32"
          delay: 0
    - operation:
      name: pollstatus
      steps:
        - step:
          name: "poll status"
          address: 0x6064
          subindex: 0x00
          value: "0xFFFF"
          delay: 5000
          isBinary: false
          dataType: "UINT"
          action: "read"
    - operation:
      # Fault reset needs a REAL 0->1 edge on bit 7.
      # Sequence: 0x06 (bit7 low) -> 0x86 (bit7 high = edge) -> 0x06 (release).
      # Note: EE08 (sync loss) cannot clear in PREOP; it clears after OP
      # (jamun does the PDO fault reset after the cyclic task starts).
      # The old "CSP mode" (0x6060 = 8) step was REMOVED: the SV680N runs free-run
      # and holds in Profile Position (Mode 1); CSP needs DC sync.
      name: faultReset
      steps:
        - step:
          name: "fault reset low"
          address: 0x6040
          subindex: 0x00
          value: "00000110"
          delay: 20000
          isBinary: true
          dataType: "U16"
          action: "write"
        - step:
          name: "fault reset rising edge"
          address: 0x6040
          subindex: 0x00
          value: "10000110"
          delay: 150000
          isBinary: true
          dataType: "U16"
          action: "write"
        - step:
          name: "clear DO"
          address: 0x60FE
          subindex: 0x01
          value: "0"
          dataType: "U32"
          action: "write"
        - step:
          name: "fault reset release"
          address: 0x6040
          subindex: 0x00
          value: "00000110"
          delay: 20000
          isBinary: true
          dataType: "U16"
          action: "write"
        - step:
          name: "read current controlword"
          address: 0x6040
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      # Multi-turn reset NOT enabled for v1 (SupportsMultiTurnReset() = false).
      # Candidate from ESI: 0x200D:0x15 "Absolute Encode Fault Reset" (H0D-20).
      # Confirm the value meaning in the SV680N manual before enabling.
      name: resetMultiTurn
      steps:
    - operation:
      name: readinputsignal
      steps:
        - step:
          name: "read digital inputs (0x60FD)"
          address: 0x60FD
          subindex: 0x00
          value: "0xFFFFFFFF"
          delay: 0
          isBinary: false
          dataType: "U32"
          action: "read"
    - operation:
      name: jog
      steps:
        - step:
          name: "set rotation status"
          address: 0x6040
          subindex: 0x00
          value: "0x005f"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "write"
        - step:
          name: "read rotation status"
          address: 0x6041
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      name: moveToPosition
      steps:
        - step:
          name: "move to position"
          address: 0x607A
          subindex: 0x00
          value: "move_to_pos_val"
          delay: 0
          isBinary: false
          dataType: "U32"
          action: "write"
    - operation:
      name: setRPM
      steps:
        - step:
          name: "set profile velocity"
          address: 0x6081
          subindex: 0x00
          value: "rpm_val"
          delay: 0
          isBinary: false
          dataType: "U32"
          action: "write"
    - operation:
      name: readError
      steps:
        - step:
          name: "read error from the driver"
          address: 0x603F
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      # No ECS input mapped for SV680N v1 — no-op.
      name: ecs
      steps:
    - operation:
      # No hardware reset input mapped for SV680N v1 — no-op.
      # (The reset storm seen on 15-Oct came from the A6Minas I/O listener in code
      #  decoding 0x60FD bit5, not from this file.)
      name: hard_reset
      steps:
    - operation:
      name: finsignal
      steps:
    - operation:
      name: readStatusword
      steps:
        - step:
          name: "read statusword"
          address: 0x6041
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      name: finsignalend
      steps:
    - operation:
      # Brake not driven via PDO for v1 — no-op.
      name: break_on
      steps:
    - operation:
      name: break_off
      steps:
    - operation:
      name: emergency
      steps:
    - operation:
      name: reverse
      steps:
        - step:
          # 0xC0 = bit7 (position polarity) + bit6 (velocity polarity).
          # Delta uses 224 (0xE0); bit5 left clear here until confirmed for Inovance.
          name: "Activate reverse direction"
          address: 0x607E
          subindex: 0x00
          value: "192"
          delay: 0
          isBinary: false
          dataType: "U8"
          action: "write"
    - operation:
      name: nonreverse
      steps:
        - step:
          name: "Activate non reverse direction"
          address: 0x607E
          subindex: 0x00
          value: "0"
          delay: 0
          isBinary: false
          dataType: "U8"
          action: "write"
# ============================================================
# motion: — Drive-hardware motion parameters
# See a6minas.yml for field descriptions.
# Loaded by AUTO-DISCOVER (IdentifyDrive -> profile.Motion) on every boot.
#
# DDR motor, 1:1 (no gearbox), user unit = 0.0001 deg (0x6091 = 65536/28125):
#   units/rev     = 3,600,000  (= 8,388,608 encoder counts, exact)
#   drive_x_ratio = units per degree = 3,600,000 / 360 = 10000 (exact)
#                   0.001 deg step = 10 units exactly (no rounding)
#   rpm_const     = jog velocity in units/s per feed unit
#     Motor max 300 rpm = jog feed 3  ->  100 rpm per feed unit
#     100 x 3,600,000 / 60 = 6,000,000
#     feed 1 = 100 rpm, feed 2 = 200 rpm, feed 3 = 300 rpm
#   Drive also caps speed at 300 rpm via 0x607F (configure section).
# ============================================================
motion:
  rpm_const: 6000000.0
  drive_x_ratio: 10000


pdo:
  # Free-run (0x0000). DC SYNC0 (0x0300) caused EE10.4 PLL faults on this setup.
  dc_assign_activate: 0x0000
  sync_managers:
    - sm: 2
      direction: output
      watchdog: enable
      pdo_index: 0x1600        # configurable on SV680N (max 10 objects)
      entries:
        - index: 0x6040
          subindex: 0x00
          bits: 16
          name: ctrl_word
        - index: 0x607A
          subindex: 0x00
          bits: 32
          name: target_pos
        - index: 0x60FF
          subindex: 0x00
          bits: 32
          name: target_vel
        - index: 0x6071
          subindex: 0x00
          bits: 16
          name: _pad_torque
        - index: 0x6060
          subindex: 0x00
          bits: 8
          name: op_mode
        - index: 0x60FE
          subindex: 0x01
          bits: 32
          name: dig_out_val
    - sm: 3
      direction: input
      watchdog: disable
      pdo_index: 0x1A00        # configurable on SV680N (max 10 objects)
      entries:
        - index: 0x6041
          subindex: 0x00
          bits: 16
          name: status_word
        - index: 0x6064
          subindex: 0x00
          bits: 32
          name: actual_pos
        - index: 0x606C
          subindex: 0x00
          bits: 32
          name: actual_vel
        - index: 0x6077
          subindex: 0x00
          bits: 16
          name: _pad_torque_actual
        - index: 0x6061
          subindex: 0x00
          bits: 8
          name: op_mode_disp
        - index: 0x60FD
          subindex: 0x00
          bits: 32
          name: digital_in
        - index: 0x603F
          subindex: 0x00
          bits: 16
          name: error_code
