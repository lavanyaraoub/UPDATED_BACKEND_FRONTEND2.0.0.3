---
# ****************************************************************************************************
# EDITTING OF THIS FILE SHOULD BE DONE BY EXPERIENCED PERSONNEL ONLY
# ANY CHANGE WITHOUT PROPER KNOWLEDGE OF ETHERCAT DEVICE ADDRESSING CAN CAUSE DAMAGE TO THE SYSTEM
# ****************************************************************************************************
# EtherCAT addressing configuration for Inovance SV680N-GINT (SV680NT012I).
# VendorID: 0x00100000  ProductCode: 0x000C012A  Revision: 0x00010000
# ESI: INOVANCE_SV680N-GINT_1Axis_V02.xml
#
# Key points (from ESI + bench reads):
#  - Supports PP, PV, PT, HM, CSP, CSV, CST (0x6502 = 0x3AD)
#  - Default RxPDO 0x1701 has NO 0x6060 -> we remap configurable 0x1600 / 0x1A00
#  - 0x608F, 0x6092, 0x60C2 do NOT exist on this drive (no interpolation-period writes)
#  - 0x6091 gear ratio = 1:1 at the drive; scaling is done in jamun (motion: section)
#  - Digital inputs from standard 0x60FD (CiA-402: bit0 NOT, bit1 POT, bit2 HOME)
#    VERIFY polarity on the bench before enabling StopWhenHWPOTNOT.
#  - Drive also supports EoE: the eoe* interface must stay DOWN or SDOs fail randomly.

ethercat:
    - operation:
      name: configure
      steps:
        - step:
          name: "operation mode (PP)"
          address: 0x6060
          subindex: 0x00
          value: "0x1"
          delay: 0
          isBinary: false
          dataType: "U8"
        - step:
          name: "profile velocity"
          address: 0x6081
          subindex: 0x00
          value: "10000000"
          delay: 0
          isBinary: false
          dataType: "U32"
        # TODO(bench): 0x6083 / 0x6084 (profile accel/decel) exist on this drive.
        # Read the drive defaults first, then add explicit values here if needed:
        #   ethercat upload -p 0 -t uint32 0x6083 0
        #   ethercat upload -p 0 -t uint32 0x6084 0
    - operation:
      name: poweron
      steps:
        - step:
          name: "drive init"
          address: 0x6040
          subindex: 0x00
          value: "0x0006"
          delay: 100000
          isBinary: false
          dataType: "U16"
        - step:
          name: "drive magnetize"
          address: 0x6040
          subindex: 0x00
          value: "7"
          delay: 100000
          isBinary: false
          dataType: "U16"
    - operation:
      name: fastPowerOn
      steps:
        - step:
          name: "fast poweron"
          address: 0x6040
          subindex: 0x00
          value: "0000000000001111"
          delay: 0
          isBinary: true
          dataType: "U16"
          action: "write"
    - operation:
      name: fastPowerOff
      steps:
        - step:
          name: "fast poweroff read"
          address: 0x6040
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
        - step:
          name: "fast poweroff"
          address: 0x6040
          subindex: 0x00
          value: "00000110"
          delay: 0
          isBinary: true
          dataType: "U16"
          action: "write"
    - operation:
      name: poweroff
      steps:
        - step:
          name: "start power off"
          address: 0x6040
          subindex: 0x00
          value: "11111111"
          delay: 0
          isBinary: true
          dataType: "U16"
        - step:
          name: "power off"
          address: 0x6040
          subindex: 0x00
          value: "00000110"
          delay: 0
          isBinary: true
          dataType: "U16"
    - operation:
      name: manualjog
      steps:
        - step:
          name: "target velocity"
          address: 0x60FF
          subindex: 0x00
          #value will be populated by the system. Do not change the jog_rpm_placeholder string.
          value: "jog_rpm_placeholder"
          isBinary: false
          dataType: "U32"
          delay: 0
        - step:
          name: "operation mode (PV)"
          address: 0x6060
          subindex: 0x00
          value: "0x3"
          delay: 0
          isBinary: false
          dataType: "U8"
    - operation:
      name: stopjog
      steps:
        - step:
          name: "target velocity"
          address: 0x60FF
          subindex: 0x00
          value: "0"
          isBinary: false
          dataType: "U32"
          delay: 0
    - operation:
      name: pollstatus
      steps:
        - step:
          name: "poll status"
          address: 0x6064
          subindex: 0x00
          value: "0xFFFF"
          delay: 5000
          isBinary: false
          dataType: "UINT"
          action: "read"
    - operation:
      name: faultReset
      steps:
        - step:
          name: "fault reset"
          address: 0x6040
          subindex: 0x00
          value: "10001111"
          delay: 150000
          isBinary: true
          dataType: "U16"
          action: "write"
        - step:
          name: "clear DO"
          address: 0x60FE
          subindex: 0x01
          value: "0"
          dataType: "U32"
          action: "write"
        - step:
          name: "read current controlword"
          address: 0x6040
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
        - step:
          name: "fault reset rising edge"
          address: 0x6040
          subindex: 0x00
          value: "10001111"
          delay: 150000
          isBinary: true
          dataType: "U16"
          action: "write"
        - step:
          name: "CSP mode"
          address: 0x6060
          subindex: 0x00
          value: "8"
          delay: 0
          isBinary: false
          dataType: "U8"
          action: "write"
    - operation:
      # Multi-turn reset NOT enabled for v1 (SupportsMultiTurnReset() = false).
      # Candidate from ESI: 0x200D:0x15 "Absolute Encode Fault Reset" (H0D-20).
      # Confirm the value meaning in the SV680N manual before enabling.
      name: resetMultiTurn
      steps:
    - operation:
      name: readinputsignal
      steps:
        - step:
          name: "read digital inputs (0x60FD)"
          address: 0x60FD
          subindex: 0x00
          value: "0xFFFFFFFF"
          delay: 0
          isBinary: false
          dataType: "U32"
          action: "read"
    - operation:
      name: jog
      steps:
        - step:
          name: "set rotation status"
          address: 0x6040
          subindex: 0x00
          value: "0x005f"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "write"
        - step:
          name: "read rotation status"
          address: 0x6041
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      name: moveToPosition
      steps:
        - step:
          name: "move to position"
          address: 0x607A
          subindex: 0x00
          value: "move_to_pos_val"
          delay: 0
          isBinary: false
          dataType: "U32"
          action: "write"
    - operation:
      name: setRPM
      steps:
        - step:
          name: "set profile velocity"
          address: 0x6081
          subindex: 0x00
          value: "rpm_val"
          delay: 0
          isBinary: false
          dataType: "U32"
          action: "write"
    - operation:
      name: readError
      steps:
        - step:
          name: "read error from the driver"
          address: 0x603F
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      # No ECS input mapped for SV680N v1 — no-op.
      name: ecs
      steps:
    - operation:
      # No hardware reset input mapped for SV680N v1 — no-op.
      name: hard_reset
      steps:
    - operation:
      name: finsignal
      steps:
    - operation:
      name: readStatusword
      steps:
        - step:
          name: "read statusword"
          address: 0x6041
          subindex: 0x00
          value: "0xFFFF"
          delay: 0
          isBinary: false
          dataType: "U16"
          action: "read"
    - operation:
      name: finsignalend
      steps:
    - operation:
      # Brake not driven via PDO for v1 — no-op.
      name: break_on
      steps:
    - operation:
      name: break_off
      steps:
    - operation:
      name: emergency
      steps:
    - operation:
      name: reverse
      steps:
        - step:
          # 0xC0 = bit7 (position polarity) + bit6 (velocity polarity).
          # Delta uses 224 (0xE0); bit5 left clear here until confirmed for Inovance.
          name: "Activate reverse direction"
          address: 0x607E
          subindex: 0x00
          value: "192"
          delay: 0
          isBinary: false
          dataType: "U8"
          action: "write"
    - operation:
      name: nonreverse
      steps:
        - step:
          name: "Activate non reverse direction"
          address: 0x607E
          subindex: 0x00
          value: "0"
          delay: 0
          isBinary: false
          dataType: "U8"
          action: "write"
# ============================================================
# motion: — Drive-hardware motion parameters
# See a6minas.yml for field descriptions.
#
# !!! VERIFY BEFORE FIRST MOVE !!!
# 0x608F does not exist on this drive, so encoder resolution must come
# from the motor nameplate. Values below ASSUME a 23-bit encoder
# (8,388,608 counts/rev) and a 120:1 table, same as the A6 23-bit config:
#   drive_x_ratio = Feed x gear / 360 = 8,388,608 x 120 / 360 = 2,796,203
#   rpm_const     = Feed x 1.5        = 12,582,912
# Recompute if the motor is 26-bit (67,108,864) or the gear ratio differs.
# ============================================================
motion:
  rpm_const: 12582910.0
  drive_x_ratio: 23302
  

pdo:
  # dc_assign_activate from ESI (SYNC0). ESI also allows free-run (0x0000).
  # If the drive throws a sync-related alarm at OP, try 0x0000 like Delta.
  dc_assign_activate: 0x0300
  sync_managers:
    - sm: 2
      direction: output
      watchdog: enable
      pdo_index: 0x1600        # configurable on SV680N (10 slots)
      entries:
        - index: 0x6040
          subindex: 0x00
          bits: 16
          name: ctrl_word
        - index: 0x607A
          subindex: 0x00
          bits: 32
          name: target_pos
        - index: 0x60FF
          subindex: 0x00
          bits: 32
          name: target_vel
        - index: 0x6071
          subindex: 0x00
          bits: 16
          name: _pad_torque
        - index: 0x6060
          subindex: 0x00
          bits: 8
          name: op_mode
        - index: 0x60FE
          subindex: 0x01
          bits: 32
          name: dig_out_val
    - sm: 3
      direction: input
      watchdog: disable
      pdo_index: 0x1A00        # configurable on SV680N
      entries:
        - index: 0x6041
          subindex: 0x00
          bits: 16
          name: status_word
        - index: 0x6064
          subindex: 0x00
          bits: 32
          name: actual_pos
        - index: 0x606C
          subindex: 0x00
          bits: 32
          name: actual_vel
        - index: 0x6077
          subindex: 0x00
          bits: 16
          name: _pad_torque_actual
        - index: 0x6061
          subindex: 0x00
          bits: 8
          name: _pad_opmode_disp
        - index: 0x60FD
          subindex: 0x00
          bits: 32
          name: digital_in
        - index: 0x603F
          subindex: 0x00
          bits: 16
          name: error_code
